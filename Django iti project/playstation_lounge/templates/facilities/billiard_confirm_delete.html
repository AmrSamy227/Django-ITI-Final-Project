{% extends 'base.html' %}

{% block title %}Delete Table - PlayStation Lounge{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card fade-in-up">
                <div class="card-header bg-gradient-red text-white">
                    <h3 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>Delete Table
                    </h3>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-circle fa-4x text-red mb-3"></i>
                    <h4>Are you sure?</h4>
                    <p class="text-muted">You're about to delete "<strong>{{ billiard.name }}</strong>". This action cannot be undone.</p>
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-red me-2">
                            <i class="fas fa-trash me-2"></i>Yes, Delete
                        </button>
                        <a href="{% url 'facilities:billiard_list' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
